services:
  db:
    container_name: db
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    # volumes:
    #   - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    container_name: redis
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
  # volumes: 
  # db_data:
